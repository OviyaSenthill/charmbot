; Charmbot firmware — ESP32-2432S028R ("Cheap Yellow Display")
; Build/upload with PlatformIO (VS Code extension or `pio run -t upload`).

[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFi + TLS + TFT fonts + games is big — give the app the most flash.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -Isrc
    -Iinclude
    ; ---- TFT_eSPI setup for the CYD (ILI9341 on HSPI) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; If your board is the ST7789 variant (screen stays white/garbled),
    ; swap ILI9341_2_DRIVER for: -DST7789_DRIVER=1 -DTFT_INVERSION_OFF
    ; If colors look inverted, add: -DTFT_INVERSION_ON
