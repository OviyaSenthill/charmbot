<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240">
  <!-- Charmbot face guide: 320x240 = the real screen. Delete this layer before exporting. -->
  <rect width="320" height="240" fill="#0B1530"/>
  <!-- safe area: eyes wander, keep the face inside -->
  <rect x="40" y="45" width="240" height="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-dasharray="6 4"/>
  <text x="44" y="41" font-family="sans-serif" font-size="9" fill="#FFFFFF" fill-opacity="0.5">safe area</text>
  <!-- eye boxes (36x48 oval + glow) -->
  <ellipse cx="110" cy="100" rx="23" ry="29" fill="none" stroke="#3FE6F5" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <ellipse cx="210" cy="100" rx="23" ry="29" fill="none" stroke="#3FE6F5" stroke-opacity="0.5" stroke-dasharray="3 3"/>
  <line x1="110" y1="92" x2="110" y2="108" stroke="#3FE6F5" stroke-opacity="0.5"/>
  <line x1="102" y1="100" x2="118" y2="100" stroke="#3FE6F5" stroke-opacity="0.5"/>
  <line x1="210" y1="92" x2="210" y2="108" stroke="#3FE6F5" stroke-opacity="0.5"/>
  <line x1="202" y1="100" x2="218" y2="100" stroke="#3FE6F5" stroke-opacity="0.5"/>
  <!-- brow zone -->
  <rect x="80" y="54" width="160" height="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-dasharray="2 3"/>
  <text x="243" y="66" font-family="sans-serif" font-size="8" fill="#FFFFFF" fill-opacity="0.4">brows</text>
  <!-- mouth zone -->
  <rect x="130" y="138" width="60" height="38" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="2 3"/>
  <circle cx="160" cy="157" r="2" fill="#3FE6F5" fill-opacity="0.6"/>
  <text x="193" y="160" font-family="sans-serif" font-size="8" fill="#FFFFFF" fill-opacity="0.4">mouth</text>
</svg>
